<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP1584EN Wiring – MasinaV3</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Oxanium:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0c0c;
    --red: #ff3333;
    --black: #888;
    --green: #39ff14;
    --accent: #00e5ff;
    --gold: #ffab00;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    font-family: 'JetBrains Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  svg { max-width: 100%; height: auto; }
  .lbl { font-family:'Oxanium',sans-serif; font-weight:700; text-anchor:middle; dominant-baseline:central; }
  .sub { font-family:'JetBrains Mono',monospace; font-weight:400; text-anchor:middle; dominant-baseline:central; }
  .pin { font-family:'JetBrains Mono',monospace; dominant-baseline:central; }
  .wlbl { font-family:'Oxanium',sans-serif; font-weight:600; dominant-baseline:central; }
  .wire { fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
  .wire-gnd { fill:none; stroke-width:3; stroke:#333; stroke-dasharray:6 3; stroke-linecap:round; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
  .fi { animation: fadeUp 0.4s ease-out both; }
</style>
</head>
<body>

<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.03"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="glow-red">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff3333" flood-opacity="0.6"/>
    </filter>
    <filter id="glow-blk">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#666" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="900" height="700" fill="var(--bg)" filter="url(#grain)"/>

  <!-- Title -->
  <text x="450" y="32" fill="var(--accent)" font-family="Oxanium" font-weight="700" font-size="22" text-anchor="middle" class="fi">MP1584EN Buck Converter Wiring</text>
  <text x="450" y="52" fill="#555" font-family="JetBrains Mono" font-size="11" text-anchor="middle" class="fi" style="animation-delay:.05s">4 wires in, 4+ wires out • Set trim pot to 5.0V BEFORE connecting anything</text>

  <!-- ==================== MP1584EN MODULE (center) ==================== -->
  <g class="fi" style="animation-delay:.1s" transform="translate(310,180)">
    <!-- PCB body -->
    <rect x="0" y="0" width="280" height="200" rx="6" fill="#1a6b1a" stroke="#0d4d0d" stroke-width="2"/>
    <rect x="8" y="8" width="264" height="184" rx="4" fill="#148a14" stroke="#0d6b0d" stroke-width="1"/>

    <!-- IC chip -->
    <rect x="60" y="50" width="70" height="50" rx="2" fill="#222" stroke="#444" stroke-width="1"/>
    <text x="95" y="78" fill="#aaa" font-family="JetBrains Mono" font-size="8" text-anchor="middle" dominant-baseline="central">MP1584EN</text>

    <!-- Inductor (silver square) -->
    <rect x="155" y="35" width="75" height="65" rx="3" fill="#bbb" stroke="#999" stroke-width="1"/>
    <text x="192" y="70" fill="#666" font-family="JetBrains Mono" font-size="8" text-anchor="middle" dominant-baseline="central">Inductor</text>

    <!-- Trim pot -->
    <circle cx="155" cy="148" r="16" fill="#c8a050" stroke="#aa8030" stroke-width="1.5"/>
    <line x1="155" y1="136" x2="155" y2="148" stroke="#333" stroke-width="2" stroke-linecap="round"/>
    <text x="155" y="175" fill="#ffe082" font-family="JetBrains Mono" font-size="9" text-anchor="middle" dominant-baseline="central">TRIM POT</text>

    <!-- ====== PADS ====== -->
    <!-- IN+ pad (top-left) -->
    <rect x="-6" y="25" width="28" height="24" rx="3" fill="#c0a030" stroke="#a08020" stroke-width="1.5"/>
    <text x="8" y="38" fill="#fff" font-family="Oxanium" font-weight="700" font-size="11" text-anchor="middle" dominant-baseline="central">IN+</text>

    <!-- IN- pad (bottom-left) -->
    <rect x="-6" y="148" width="28" height="24" rx="3" fill="#c0a030" stroke="#a08020" stroke-width="1.5"/>
    <text x="8" y="161" fill="#fff" font-family="Oxanium" font-weight="700" font-size="11" text-anchor="middle" dominant-baseline="central">IN-</text>

    <!-- OUT+ pad (bottom-right) -->
    <rect x="258" y="148" width="28" height="24" rx="3" fill="#c0a030" stroke="#a08020" stroke-width="1.5"/>
    <text x="272" y="161" fill="#fff" font-family="Oxanium" font-weight="700" font-size="10" text-anchor="middle" dominant-baseline="central">OUT+</text>

    <!-- OUT- pad (top-right) -->
    <rect x="258" y="25" width="28" height="24" rx="3" fill="#c0a030" stroke="#a08020" stroke-width="1.5"/>
    <text x="272" y="38" fill="#fff" font-family="Oxanium" font-weight="700" font-size="10" text-anchor="middle" dominant-baseline="central">OUT-</text>

    <!-- Pad polarity symbols on PCB -->
    <text x="30" y="38" fill="#fff" font-family="Oxanium" font-weight="700" font-size="14" dominant-baseline="central">+</text>
    <text x="30" y="161" fill="#fff" font-family="Oxanium" font-weight="700" font-size="14" dominant-baseline="central">-</text>
    <text x="248" y="38" fill="#fff" font-family="Oxanium" font-weight="700" font-size="11" text-anchor="end" dominant-baseline="central">&#x2296;</text>
    <text x="248" y="161" fill="#fff" font-family="Oxanium" font-weight="700" font-size="11" text-anchor="end" dominant-baseline="central">&#x2295;</text>
  </g>

  <!-- Module label -->
  <text x="450" y="410" fill="#4a4" font-family="Oxanium" font-weight="600" font-size="13" text-anchor="middle" class="fi" style="animation-delay:.12s">MP1584EN Module (top view, matching your photo)</text>

  <!-- ==================== INPUT SIDE (LEFT) ==================== -->

  <!-- ESC / Battery source box -->
  <g class="fi" style="animation-delay:.18s">
    <rect x="30" y="175" width="170" height="120" rx="6" fill="#131313" stroke="#444" stroke-width="1.5"/>
    <text x="115" y="218" class="lbl" font-size="18" fill="#e0e0e0">ESC</text>
    <text x="115" y="242" class="sub" font-size="10" fill="#666">VBAT pads</text>
    <text x="115" y="260" class="sub" font-size="10" fill="#666">(battery voltage)</text>
    <!-- Pad labels -->
    <text x="205" y="210" class="pin" font-size="10" fill="var(--red)" text-anchor="start">B+</text>
    <text x="205" y="275" class="pin" font-size="10" fill="#888" text-anchor="start">B-</text>
  </g>

  <!-- Wire: ESC B+ → IN+ (red) -->
  <g class="fi" style="animation-delay:.25s" filter="url(#glow-red)">
    <path class="wire" stroke="var(--red)" d="M200,210 L270,210 L270,218 L304,218"/>
    <rect x="222" y="194" width="42" height="16" rx="2" fill="var(--bg)" opacity="0.9"/>
    <text x="243" y="204" class="wlbl" font-size="10" fill="var(--red)" text-anchor="middle">VBAT+</text>
  </g>

  <!-- Wire: ESC B- → IN- (dark/ground) -->
  <g class="fi" style="animation-delay:.28s" filter="url(#glow-blk)">
    <path class="wire-gnd" d="M200,275 L270,275 L270,341 L304,341"/>
    <rect x="222" y="296" width="30" height="16" rx="2" fill="var(--bg)" opacity="0.9"/>
    <text x="237" y="306" class="wlbl" font-size="10" fill="#888" text-anchor="middle">GND</text>
  </g>

  <!-- ==================== OUTPUT SIDE (RIGHT) ==================== -->

  <!-- Split point for outputs -->
  <!-- OUT+ wire from module -->
  <g class="fi" style="animation-delay:.32s" filter="url(#glow-red)">
    <path class="wire" stroke="var(--red)" d="M596,341 L660,341"/>
    <!-- Split dot -->
    <circle cx="660" cy="341" r="5" fill="var(--red)"/>
    <!-- Branch to Pi -->
    <path class="wire" stroke="var(--red)" d="M660,341 L660,295 L720,295"/>
    <!-- Branch to GPS -->
    <path class="wire" stroke="var(--red)" d="M660,341 L660,485 L720,485"/>
  </g>

  <!-- OUT- wire from module -->
  <g class="fi" style="animation-delay:.35s" filter="url(#glow-blk)">
    <path class="wire-gnd" d="M596,218 L640,218"/>
    <!-- Split dot -->
    <circle cx="640" cy="218" r="5" fill="#666"/>
    <!-- Branch to Pi -->
    <path class="wire-gnd" d="M640,218 L640,320 L720,320"/>
    <!-- Branch to GPS -->
    <path class="wire-gnd" d="M640,218 L640,510 L720,510"/>
  </g>

  <!-- 5V labels on output -->
  <g class="fi" style="animation-delay:.33s">
    <rect x="600" y="330" width="28" height="15" rx="2" fill="var(--bg)" opacity="0.9"/>
    <text x="614" y="340" class="wlbl" font-size="10" fill="var(--red)" text-anchor="middle">5V</text>
  </g>
  <g class="fi" style="animation-delay:.36s">
    <rect x="600" y="204" width="30" height="15" rx="2" fill="var(--bg)" opacity="0.9"/>
    <text x="615" y="214" class="wlbl" font-size="10" fill="#888" text-anchor="middle">GND</text>
  </g>

  <!-- Pi Zero 2 box -->
  <g class="fi" style="animation-delay:.4s">
    <rect x="720" y="260" width="155" height="95" rx="6" fill="#131313" stroke="var(--accent)" stroke-width="1.5"/>
    <text x="797" y="298" class="lbl" font-size="16" fill="var(--accent)">Pi Zero 2</text>
    <text x="797" y="320" class="sub" font-size="10" fill="#666">GPIO Header</text>
    <!-- Pin labels -->
    <text x="715" y="295" class="pin" font-size="10" fill="var(--red)" text-anchor="end">Pin 2 (5V)</text>
    <text x="715" y="320" class="pin" font-size="10" fill="#888" text-anchor="end">Pin 6 (GND)</text>
    <circle cx="720" cy="295" r="3" fill="var(--red)"/>
    <circle cx="720" cy="320" r="3" fill="#666"/>
  </g>

  <!-- GPS box -->
  <g class="fi" style="animation-delay:.45s">
    <rect x="720" y="458" width="155" height="85" rx="6" fill="#131313" stroke="var(--green)" stroke-width="1.5"/>
    <text x="797" y="493" class="lbl" font-size="16" fill="var(--green)">GPS</text>
    <text x="797" y="515" class="sub" font-size="10" fill="#666">BN-220 / M10</text>
    <!-- Pin labels -->
    <text x="715" y="485" class="pin" font-size="10" fill="var(--red)" text-anchor="end">VCC</text>
    <text x="715" y="510" class="pin" font-size="10" fill="#888" text-anchor="end">GND</text>
    <circle cx="720" cy="485" r="3" fill="var(--red)"/>
    <circle cx="720" cy="510" r="3" fill="#666"/>
  </g>

  <!-- ==================== WIRE COLOR LEGEND ==================== -->
  <g class="fi" style="animation-delay:.55s">
    <rect x="30" y="440" width="230" height="120" rx="5" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="1"/>
    <text x="50" y="464" fill="#555" font-family="Oxanium" font-weight="600" font-size="12">WIRE COLORS (suggested)</text>

    <line x1="50" y1="488" x2="85" y2="488" stroke="var(--red)" stroke-width="3"/>
    <text x="95" y="492" class="pin" font-size="11" fill="#bbb">Red — power positive</text>

    <line x1="50" y1="512" x2="85" y2="512" stroke="#333" stroke-width="3" stroke-dasharray="5 3"/>
    <text x="95" y="516" class="pin" font-size="11" fill="#bbb">Black — ground (GND)</text>

    <line x1="50" y1="536" x2="85" y2="536" stroke="var(--gold)" stroke-width="3"/>
    <text x="95" y="540" class="pin" font-size="11" fill="#bbb">Yellow — signal (not shown)</text>
  </g>

  <!-- ==================== WIRING TABLE ==================== -->
  <g class="fi" style="animation-delay:.6s">
    <rect x="30" y="580" width="840" height="105" rx="5" fill="#0f0f0f" stroke="#2a2a2a" stroke-width="1"/>
    <text x="50" y="604" fill="#555" font-family="Oxanium" font-weight="600" font-size="12">WIRING SUMMARY — 4 solder points on the module</text>

    <text x="50" y="628" class="pin" font-size="11" fill="var(--red)">IN+  (left top pad)</text>
    <text x="265" y="628" class="pin" font-size="11" fill="#bbb">← Red wire from ESC VBAT+ pad (14.8–21V)</text>

    <text x="50" y="648" class="pin" font-size="11" fill="#888">IN-  (left bottom pad)</text>
    <text x="265" y="648" class="pin" font-size="11" fill="#bbb">← Black wire from ESC GND pad</text>

    <text x="50" y="668" class="pin" font-size="11" fill="var(--red)">OUT+ (right bottom pad, ⊕)</text>
    <text x="265" y="668" class="pin" font-size="11" fill="#bbb">← Red wire → splits to Pi pin 2 (5V) + GPS VCC</text>

    <text x="50" y="688" class="pin" font-size="11" fill="#888">OUT- (right top pad, ⊖)</text>
    <text x="265" y="688" class="pin" font-size="11" fill="#bbb">← Black wire → splits to Pi pin 6 (GND) + GPS GND</text>
  </g>

  <!-- ==================== WARNING ==================== -->
  <g class="fi" style="animation-delay:.65s">
    <rect x="300" y="440" width="325" height="105" rx="5" fill="#1a0a0a" stroke="#ff3333" stroke-width="1.5"/>
    <text x="320" y="465" fill="#ff3333" font-family="Oxanium" font-weight="700" font-size="13">BEFORE CONNECTING ANYTHING</text>
    <text x="320" y="488" class="pin" font-size="11" fill="#e88">1. Wire only IN+ and IN- to battery/ESC</text>
    <text x="320" y="508" class="pin" font-size="11" fill="#e88">2. Power on, turn trim pot → measure 5.0V</text>
    <text x="320" y="528" class="pin" font-size="11" fill="#e88">3. THEN solder OUT+ and OUT- to Pi + GPS</text>
  </g>

</svg>
</body>
</html>
